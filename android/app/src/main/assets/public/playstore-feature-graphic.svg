<svg width="1024" height="500" viewBox="0 0 1024 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1024" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#062e1e" />
      <stop offset="45%" stop-color="#0d4a2c" />
      <stop offset="100%" stop-color="#1b4d2e" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5FA136" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#5FA136" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#062e1e" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bgGrad)" />
  <circle cx="200" cy="150" r="320" fill="url(#glow)" />
  <circle cx="850" cy="380" r="260" fill="url(#glow)" />

  <!-- Subtle Forestry Grid Lines -->
  <path d="M0 100 H1024 M0 200 H1024 M0 300 H1024 M0 400 H1024" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
  <path d="M200 0 V500 M400 0 V500 M600 0 V500 M800 0 V500" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />

  <!-- Left Content Column -->
  <g transform="translate(64, 80)">
    <!-- Small Category Pill -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#5FA136" fill-opacity="0.25" stroke="#5FA136" stroke-width="1.5" />
    <circle cx="18" cy="17" r="5" fill="#84cc16" />
    <text x="32" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#a3e635" letter-spacing="1">ANSI Z133 CERTIFIED AI</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      GreenTree ArborLink
    </text>
    <text x="0" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="url(#accentGrad)" letter-spacing="-0.5">
      Voice AI &amp; Field Dispatch
    </text>

    <!-- Subtitle / Value Prop -->
    <text x="0" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#d1fae5">
      Hands-free voicemail intake, storm hazard triage, and instant CRM sync.
    </text>
    <text x="0" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#86efac">
      Engineered for tree care crews in Columbus, GA &amp; Phenix City, AL
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 240)">
      <!-- Badge 1: Arb-E -->
      <rect x="0" y="0" width="165" height="42" rx="12" fill="#000000" fill-opacity="0.35" stroke="#ffffff" stroke-opacity="0.15" />
      <text x="16" y="26" font-size="18">🐒</text>
      <text x="46" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Arb-E Voice Agent</text>

      <!-- Badge 2: Telephony -->
      <rect x="180" y="0" width="175" height="42" rx="12" fill="#000000" fill-opacity="0.35" stroke="#ffffff" stroke-opacity="0.15" />
      <text x="196" y="26" font-size="16">📞</text>
      <text x="226" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Native Dialer Intent</text>

      <!-- Badge 3: Android Native -->
      <rect x="370" y="0" width="160" height="42" rx="12" fill="#000000" fill-opacity="0.35" stroke="#ffffff" stroke-opacity="0.15" />
      <text x="386" y="26" font-size="16">⚡</text>
      <text x="414" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Android 15+ AAB</text>
    </g>
  </g>

  <!-- Right Visual Mockup Card -->
  <g transform="translate(680, 50)" filter="url(#shadow)">
    <!-- Simulated Phone Frame Card -->
    <rect x="0" y="0" width="280" height="400" rx="32" fill="#111827" stroke="#374151" stroke-width="3" />
    <rect x="10" y="10" width="260" height="380" rx="24" fill="#064e3b" />

    <!-- Speaker notch -->
    <rect x="100" y="18" width="60" height="5" rx="2.5" fill="#374151" />

    <!-- Mini UI Inside Phone -->
    <g transform="translate(24, 38)">
      <!-- App Header -->
      <text x="0" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">🌲 ArborLink Mobile</text>
      <circle cx="220" cy="14" r="4" fill="#22c55e" />

      <!-- Caller Pill -->
      <rect x="0" y="32" width="232" height="64" rx="14" fill="#ffffff" fill-opacity="0.1" stroke="#5FA136" stroke-width="1.2" />
      <text x="14" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">David Patterson</text>
      <text x="14" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#86efac">412 River Road • Emergency</text>
      <rect x="165" y="44" width="55" height="20" rx="6" fill="#dc2626" />
      <text x="171" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">OVERHEAD</text>

      <!-- Arb-E Triage Bubble -->
      <rect x="0" y="108" width="232" height="110" rx="14" fill="#042f2e" stroke="#14b8a6" stroke-width="1" />
      <text x="12" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#2dd4bf">🐒 Arb-E Live Assistant</text>
      <text x="12" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#ccfbf1">"Southern Red Oak branch</text>
      <text x="12" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#ccfbf1">snapped on utility drop.</text>
      <text x="12" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#ccfbf1">ANSI Z133 triage logged!"</text>
      <rect x="12" y="192" width="208" height="18" rx="6" fill="#134e4a" />
      <text x="40" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#5eead4">Auto-synced to CRM Leads</text>

      <!-- Action Button inside Phone -->
      <rect x="0" y="232" width="232" height="42" rx="12" fill="#5FA136" />
      <text x="54" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">📞 Launch Crew Dispatch</text>
    </g>
  </g>
</svg>
