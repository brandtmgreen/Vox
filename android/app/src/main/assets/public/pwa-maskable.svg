      <path d="M 10 16 C 10 26 18 34 28 34 L 31 34 C 32.5 34 33 33 33 31.5 L 32 27 C 31.5 25.5 30 25 29 25.5 L 26 27 C 22 25 19 22 17 18 L 18.5 15 C 19 14 18.5 12.5 17 12 L 12.5 11 C 11 11 10 11.5 10 13 Z" fill="#ffffff" />
