<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background with subtle corner radius (rounded rectangle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Radar / Voice Pulse Rings behind tree -->
  <circle cx="256" cy="240" r="190" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="8 6" opacity="0.3" />
  <circle cx="256" cy="240" r="150" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="12 8" opacity="0.4" />
  <circle cx="256" cy="240" r="110" fill="url(#pulseGlow)" />

  <!-- Tree Trunk & Roots -->
  <path d="M236 340 L236 400 Q236 415 220 425 L200 435 M276 340 L276 400 Q276 415 292 425 L312 435" stroke="#fef3c7" stroke-width="14" stroke-linecap="round" fill="none" />
  <path d="M256 320 L256 420" stroke="#fef3c7" stroke-width="16" stroke-linecap="round" />

  <!-- Dense Arbor Canopy (Layered Triangles & Clouds) -->
  <path d="M256 120 L350 250 L310 250 L380 340 L132 340 L202 250 L162 250 Z" fill="url(#leafGrad)" />
  <path d="M256 140 L330 240 L295 240 L355 320 L157 320 L217 240 L182 240 Z" fill="#059669" opacity="0.9" />

  <!-- Arb-E Mascot Helmet / Face Emblem at Center Base -->
  <g transform="translate(256, 275) scale(0.9)">
    <!-- Helmet Outer -->
    <path d="M -38 -20 C -38 -45 38 -45 38 -20 L 42 -10 L -42 -10 Z" fill="url(#goldGrad)" />
    <!-- Helmet Brim -->
    <rect x="-46" y="-12" width="92" height="7" rx="3.5" fill="#f59e0b" />
    <!-- Helmet Headlamp -->
    <rect x="-10" y="-28" width="20" height="12" rx="3" fill="#ffffff" />
    <circle cx="0" cy="-22" r="4" fill="#38bdf8" />
    <!-- Arb-E Face -->
    <ellipse cx="0" cy="10" rx="32" ry="26" fill="#fef3c7" />
    <!-- Ears -->
    <circle cx="-32" cy="6" r="11" fill="#fde68a" stroke="#d97706" stroke-width="2" />
    <circle cx="32" cy="6" r="11" fill="#fde68a" stroke="#d97706" stroke-width="2" />
    <circle cx="-32" cy="6" r="6" fill="#f59e0b" />
    <circle cx="32" cy="6" r="6" fill="#f59e0b" />
    <!-- Friendly Eyes -->
    <ellipse cx="-12" cy="6" rx="4" ry="6" fill="#1e293b" />
    <ellipse cx="12" cy="6" rx="4" ry="6" fill="#1e293b" />
    <circle cx="-10" cy="4" r="1.5" fill="#ffffff" />
    <circle cx="14" cy="4" r="1.5" fill="#ffffff" />
    <!-- Smile & Snout -->
    <ellipse cx="0" cy="18" rx="10" ry="6" fill="#fed7aa" />
    <circle cx="-3" cy="16" r="1.5" fill="#78350f" />
    <circle cx="3" cy="16" r="1.5" fill="#78350f" />
    <path d="M -6 20 Q 0 25 6 20" stroke="#78350f" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

  <!-- Voice Waves Right -->
  <path d="M 370 210 Q 385 240 370 270" stroke="#fcd34d" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M 395 195 Q 415 240 395 285" stroke="#fcd34d" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M 420 180 Q 448 240 420 300" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Voice Waves Left -->
  <path d="M 142 210 Q 127 240 142 270" stroke="#fcd34d" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M 117 195 Q 97 240 117 285" stroke="#fcd34d" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M 92 180 Q 64 240 92 300" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Phone Call Signal Badge at Top Right -->
  <g transform="translate(380, 80)">
    <circle cx="20" cy="20" r="32" fill="#22c55e" stroke="#ffffff" stroke-width="4" />
    <path d="M 10 16 C 10 26 18 34 28 34 L 31 34 C 32.5 34 33 33 33 31.5 L 32 27 C 31.5 25.5 30 25 29 25.5 L 26 27 C 22 25 19 22 17 18 L 18.5 15 C 19 14 18.5 12.5 17 12 L 12.5 11 C 11 11 10 11.5 10 13 Z" fill="#ffffff" />
  </g>

  <!-- Title Text at Bottom -->
  <text x="256" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ecfdf5" letter-spacing="3">ARBORLINK AI</text>
</svg>
