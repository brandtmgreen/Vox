    <script>
      // Gracefully prevent unhandled WebSocket/Vite HMR errors in cloud reverse proxy environments
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && (String(event.reason.message || event.reason).includes('WebSocket') || String(event.reason.message || event.reason).includes('vite'))) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (event && (String(event.message || '').includes('WebSocket') || String(event.filename || '').includes('@vite/client'))) {
          event.preventDefault();
        }
      });
    </script>
